[build-system]
requires = [ "pybind11==2.12.0", "setuptools==83.0.0", "pkgconfig==1.5.5"]
build-backend = "setuptools.build_meta"

[project]
name = "uffpsim"
version = "0.1.3"
authors = [
    { name = "Rajendra Kumar" },
    { name = "Gian Marco Ghiandoni" }
]
maintainers = [
    {name = "Rajendra Kumar"}
]
description = "Ultra-fast compound similarity search"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
    "rdkit>=2024.3.2",
    "numpy>=1.26.4",
    "scipy>=1.13",
    "Flask>=3.0,<4",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0,<8",
    "sphinx_rtd_theme>=2.0.0",
    "sphinx-inline-tabs>=2023.4.21",
]

[project.scripts]
uffpsim = "uffpsim.cli:main"

[tool.setuptools.package-data]
"uffpsim.web_app" = [
    "templates/*.html",
    "static/**/*.css",
    "static/**/*.js",
]