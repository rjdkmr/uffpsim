name: Build and Release Wheels

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64"
          CIBW_BEFORE_ALL_LINUX: >-
            /bin/bash -c "
            dnf install -y openssl-devel pkgconfig;
            dnf install -y epel-release;
            dnf install -y hdf5-devel hdf5;
            "
          CIBW_BEFORE_ALL_MACOS: >-
            /bin/bash -c "
            brew install hdf5 pkg-config libomp;
            test -d /opt/homebrew/opt/libomp/include -o -d /usr/local/opt/libomp/include"
          CIBW_ENVIRONMENT_MACOS: >-
            CC=clang CXX=clang++ UFFPSIM_MACOS_OPENMP=1 MACOSX_DEPLOYMENT_TARGET=10.15
            CPPFLAGS="-I/opt/homebrew/opt/hdf5/include -I/usr/local/opt/hdf5/include -I/opt/homebrew/opt/libomp/include -I/usr/local/opt/libomp/include"
            CFLAGS="-Xpreprocessor -fopenmp"
            CXXFLAGS="-Xpreprocessor -fopenmp"
            LDFLAGS="-L/opt/homebrew/opt/hdf5/lib -L/usr/local/opt/hdf5/lib -L/opt/homebrew/opt/libomp/lib -L/usr/local/opt/libomp/lib -lomp"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ./wheelhouse/*.whl

  upload_release_assets:
    name: Upload wheels to release
    needs: build_wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: false

      - name: Upload wheels to GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/**/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: build_wheels # Ensures publishing only happens if the build succeeds
    runs-on: ubuntu-latest

    environment:
      name: pypi # Matches the environment configured in PyPI
      url: https://pypi.org # Optional: adds a direct link to your job output
    
    permissions:
      id-token: write # MANDATORY for PyPI Trusted Publishing

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          merge-multiple: true
      
      - name: List files
        run: ls -R dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
